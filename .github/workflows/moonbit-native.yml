name: MoonBit Native SDK

on:
  push:
    branches: [feat/moonbit-native-sdk]
    paths:
      - "bindings/moonbit/**"
      - "bindings/moonbit-consumer-smoke/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "src/**"
      - ".github/workflows/moonbit-native.yml"
  pull_request:
    paths:
      - "bindings/moonbit/**"
      - "bindings/moonbit-consumer-smoke/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "src/**"
      - ".github/workflows/moonbit-native.yml"
  workflow_dispatch:

concurrency:
  group: moonbit-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-conformance:
    name: Full native conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/moonbit/native
      - name: Install MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchains and check generated code
        working-directory: bindings/moonbit
        shell: bash
        run: |
          set -euo pipefail
          moon version --all
          rustc --version
          cargo --version
          python3 --version
          python3 tools/hawdb_derive.py examples/records.mbt.in tests/conformance/records.generated.mbt --check
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/check_api_surface.py
          moon check --target native
      - name: Build against current HawDB source (rolling)
        working-directory: bindings/moonbit/native
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1
          cargo fmt --all -- --check
          cargo test --release --lib
          cargo build --release
          test -s target/release/libhawdb_moonbit.a
      - name: Configure native linker for macOS
        if: runner.os == 'macOS'
        working-directory: bindings/moonbit
        shell: bash
        run: python3 tools/configure_native_link.py --os macos
      - name: Execute native database conformance
        working-directory: bindings/moonbit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tests/conformance-db
          moon run --target native tests/conformance 2>&1 | tee conformance.log
          ! grep -q '^CASE_FAIL ' conformance.log
          grep -Fxq 'HAWDB_MOONBIT_BUSINESS_SUITE_PASS' conformance.log
      - name: Configure external consumer linker (macOS)
        if: runner.os == 'macOS'
        working-directory: bindings/moonbit
        shell: bash
        run: python3 tools/configure_native_link.py --os macos --pkg ../moonbit-consumer-smoke/consumer/moon.pkg --sdk-prefix ../../moonbit/
      - name: Execute independent MoonBit consumer
        working-directory: bindings/moonbit-consumer-smoke/consumer
        shell: bash
        run: |
          set -euo pipefail
          moon check --target native
          moon run --target native . 2>&1 | tee external-consumer.log
          ! grep -q '^EXTERNAL_CONSUMER_FAIL ' external-consumer.log
          grep -Fxq 'EXTERNAL_CONSUMER_PASS' external-consumer.log
      - name: Stage ABI-specific SDK review artifact
        if: success()
        working-directory: bindings/moonbit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage_release.py --os "${{ runner.os }}" --arch "${{ runner.arch }}"
      - name: Upload SDK review artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moonbit-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            bindings/moonbit/dist/*.tar.gz
            bindings/moonbit/dist/*.sha256
          if-no-files-found: error
      - name: Verify no dynamic dependency on generic HawDB FFI
        if: runner.os == 'Linux'
        working-directory: bindings/moonbit
        shell: bash
        run: |
          set -euo pipefail
          ldd _build/native/debug/build/tests/conformance/conformance.exe | tee dynamic-libraries.log
          ! grep -q 'libhawdb_ffi' dynamic-libraries.log

  windows-conformance:
    name: Full native conformance (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Disable Git automatic CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # Match colmugx/posoco's Windows native toolchain initialization.
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/moonbit/native
      - name: Install MoonBit for Windows
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate MoonBit toolchain and generated code
        working-directory: bindings/moonbit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          moon version --all
          rustc --version
          cargo --version
          python --version
          python tools/hawdb_derive.py examples/records.mbt.in tests/conformance/records.generated.mbt --check
          if ($LASTEXITCODE -ne 0) { throw "Derived MoonBit source is stale" }
          python -m unittest discover -s tools/tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw "Generator tests failed" }
          python tools/check_api_surface.py
          if ($LASTEXITCODE -ne 0) { throw "Public API drift" }
          moon check --target native
          if ($LASTEXITCODE -ne 0) { throw "MoonBit native check failed" }
      - name: Build against current HawDB source (rolling)
        working-directory: bindings/moonbit/native
        shell: pwsh
        run: |
          git ls-files --error-unmatch Cargo.lock 2>$null
          if ($LASTEXITCODE -eq 0) { throw "SDK Cargo.lock must not be committed" }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "Rust formatting failed" }
          cargo test --release --lib
          if ($LASTEXITCODE -ne 0) { throw "Native lifecycle tests failed" }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "Rust staticlib build failed" }
          if (!(Test-Path "target/release/hawdb_moonbit.lib")) { throw "Missing Rust .lib output" }
      - name: Configure Windows native linker
        working-directory: bindings/moonbit
        shell: pwsh
        run: |
          python tools/configure_native_link.py --os windows
          if ($LASTEXITCODE -ne 0) { throw "Linker config failed" }
      - name: Run real embedded HawDB conformance
        working-directory: bindings/moonbit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path tests/conformance-db) {
            Remove-Item -Recurse -Force tests/conformance-db
          }
          moon run --target native tests/conformance 2>&1 | Tee-Object -FilePath conformance.log
          if ($LASTEXITCODE -ne 0) { throw "MoonBit/HawDB native executable failed" }
          $log = Get-Content -Path conformance.log -Raw
          if ($log -match '(?m)^CASE_FAIL ') { throw "Native conformance contains CASE_FAIL" }
          if ($log -notmatch '(?m)^HAWDB_MOONBIT_BUSINESS_SUITE_PASS\r?$') {
            throw "Missing real-engine conformance success marker"
          }
      - name: Configure independent consumer linker
        working-directory: bindings/moonbit
        shell: pwsh
        run: |
          python tools/configure_native_link.py --os windows --pkg ../moonbit-consumer-smoke/consumer/moon.pkg --sdk-prefix ../../moonbit/
          if ($LASTEXITCODE -ne 0) { throw "Consumer link setup failed" }
      - name: Execute independent MoonBit consumer
        working-directory: bindings/moonbit-consumer-smoke/consumer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          moon check --target native
          if ($LASTEXITCODE -ne 0) { throw "Consumer check failed" }
          moon run --target native . 2>&1 | Tee-Object -FilePath external-consumer.log
          if ($LASTEXITCODE -ne 0) { throw "Consumer executable failed" }
          $log = Get-Content external-consumer.log -Raw
          if ($log -match '(?m)^EXTERNAL_CONSUMER_FAIL ') { throw "Consumer failure marker" }
          if ($log -notmatch '(?m)^EXTERNAL_CONSUMER_PASS\r?$') {
            throw "Missing consumer pass marker"
          }
      - name: Stage Windows SDK review artifact
        working-directory: bindings/moonbit
        shell: pwsh
        run: |
          python tools/stage_release.py --os Windows --arch X64
          if ($LASTEXITCODE -ne 0) { throw "Review artifact staging failed" }
      - name: Upload Windows SDK review artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonbit-native-Windows-X64
          path: |
            bindings/moonbit/dist/*.tar.gz
            bindings/moonbit/dist/*.sha256
          if-no-files-found: error
