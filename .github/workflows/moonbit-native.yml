name: MoonBit Native SDK

on:
  push:
    branches: [feat/moonbit-native-sdk]
    paths:
      - "bindings/moonbit/**"
      - ".github/workflows/moonbit-native.yml"
  pull_request:
    paths:
      - "bindings/moonbit/**"
      - ".github/workflows/moonbit-native.yml"
  workflow_dispatch:

concurrency:
  group: moonbit-native-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact toolchain observed in the passing Linux native conformance job.
  MOONBIT_EXPECTED_VERSION: "0.1.20261023"

permissions:
  contents: read

jobs:
  native-conformance:
    name: Full native conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/moonbit/native
      - name: Install MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchains and check generated code
        working-directory: bindings/moonbit
        shell: bash
        run: |
          set -euo pipefail
          moon version --all
          moon version --all | grep -F "moon $MOONBIT_EXPECTED_VERSION "
          rustc --version
          cargo --version
          python3 --version
          python3 tools/hawdb_derive.py examples/records.mbt.in tests/conformance/records.generated.mbt --check
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          moon check --target native
      - name: Build adapter with frozen dependencies
        working-directory: bindings/moonbit/native
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo build --release --locked
          test -s target/release/libhawdb_moonbit.a
      - name: Add Apple system frameworks for the native Rust staticlib
        if: runner.os == 'macOS'
        working-directory: bindings/moonbit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          pkg = Path("tests/conformance/moon.pkg")
          src = pkg.read_text()
          old = "libhawdb_moonbit.a -ldl -lpthread -lm"
          assert src.count(old) == 1
          pkg.write_text(src.replace(old, old + " -framework CoreFoundation -framework IOKit"))
          PY
      - name: Execute native database conformance
        working-directory: bindings/moonbit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tests/conformance-db
          moon run --target native tests/conformance 2>&1 | tee conformance.log
          ! grep -q '^CASE_FAIL ' conformance.log
          grep -Fxq 'HAWDB_MOONBIT_BUSINESS_SUITE_PASS' conformance.log
      - name: Stage ABI-specific SDK review artifact
        if: success()
        working-directory: bindings/moonbit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage_release.py --os "${{ runner.os }}" --arch "${{ runner.arch }}"
      - name: Upload SDK review artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moonbit-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            bindings/moonbit/dist/*.tar.gz
            bindings/moonbit/dist/*.sha256
          if-no-files-found: error
      - name: Verify no dynamic dependency on generic HawDB FFI
        if: runner.os == 'Linux'
        working-directory: bindings/moonbit
        shell: bash
        run: |
          set -euo pipefail
          ldd _build/native/debug/build/tests/conformance/conformance.exe | tee dynamic-libraries.log
          ! grep -q 'libhawdb_ffi' dynamic-libraries.log

  windows-compile:
    name: Windows native typecheck and Rust adapter compile
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/moonbit/native
      - name: Install MoonBit for Windows
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Typecheck MoonBit native target
        working-directory: bindings/moonbit
        shell: pwsh
        run: |
          moon version --all
          moon check --target native
      - name: Compile Rust engine adapter without native executable linking
        working-directory: bindings/moonbit/native
        shell: pwsh
        run: cargo check --locked
